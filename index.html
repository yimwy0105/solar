<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>우리 태양계 친구들 🪐</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-1: #0B0E2E;
    --bg-2: #1A1B4B;
    --accent: #FFD93D;
    --pink: #FF6B9D;
    --mint: #4ECDC4;
    --text: #FFFFFF;
    --text-soft: #FFE5A0;
    --text-dim: #b4b9d8;
    --font-title: 'Jua', sans-serif;
    --font-body: 'Gaegu', sans-serif;
    --font-fancy: 'Nanum Pen Script', cursive;
  }

  /* Theme: dusk (sunset / warm) */
  body[data-theme="dusk"] {
    --bg-1: #2a1a3e;
    --bg-2: #4d2752;
    --accent: #FFC857;
    --pink: #FF7E92;
    --mint: #FFB47A;
    --text: #FFF5E8;
    --text-soft: #FFD9A8;
    --text-dim: #d4b8c4;
  }

  /* Theme: pastel (light, day) */
  body[data-theme="pastel"] {
    --bg-1: #C6E4FF;
    --bg-2: #FFD9F0;
    --accent: #FF9CC8;
    --pink: #FF6B9D;
    --mint: #5DC9B7;
    --text: #2A2D5B;
    --text-soft: #5B4FA3;
    --text-dim: #6e6e95;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-1);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    touch-action: manipulation;
    position: fixed;
    width: 100%;
  }

  button {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  body[data-large-text="true"] {
    font-size: 1.18em;
  }

  #root, .app-root {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vh 4vw;
    background: radial-gradient(ellipse at top, var(--bg-2), var(--bg-1) 70%);
    animation: fadeIn 0.5s ease-out;
    overflow: hidden;
  }

  body[data-theme="pastel"] .screen {
    background: radial-gradient(ellipse at top, #FFD9F0, #C6E4FF 70%);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }

  /* ─── STARFIELD ─── */
  .starfield {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  body[data-theme="pastel"] .starfield { opacity: 0.4; }

  /* ─── BUTTONS ─── */
  .big-button {
    font-family: var(--font-title);
    font-size: clamp(22px, 3vw, 36px);
    padding: 18px 44px;
    border: 4px solid #2A2D5B;
    border-radius: 999px;
    background: var(--pink);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #2A2D5B, 0 12px 24px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    z-index: 5;
    letter-spacing: 0.03em;
  }
  body[data-theme="pastel"] .big-button {
    border-color: #4B3F8B;
    box-shadow: 0 6px 0 #4B3F8B, 0 12px 24px rgba(75,63,139,0.15);
  }
  .big-button:hover { transform: translateY(-2px); }
  .big-button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #2A2D5B, 0 4px 8px rgba(0,0,0,0.3);
  }
  .big-button:disabled { opacity: 0.6; cursor: not-allowed; }
  .pink-button { background: var(--pink); }
  .mint-button { background: var(--mint); color: #fff; }

  .ghost-button {
    font-family: var(--font-title);
    font-size: clamp(16px, 1.6vw, 22px);
    padding: 10px 20px;
    border: 3px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  body[data-theme="pastel"] .ghost-button {
    background: rgba(255,255,255,0.7);
    color: #2A2D5B;
    border-color: rgba(42,45,91,0.3);
  }
  .ghost-button:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-1px);
  }

  /* ─── INTRO SCREEN ─── */
  .intro-screen { gap: 32px; }

  .rocket-wrap {
    position: relative;
    z-index: 2;
    transform-origin: center bottom;
  }
  .rocket-wrap.floating {
    animation: floatUp 3s ease-in-out infinite;
  }
  .rocket-wrap.launching {
    animation: launch 1.1s cubic-bezier(.55,.04,.62,.06) forwards;
  }
  @keyframes floatUp {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-22px) rotate(3deg); }
  }
  @keyframes launch {
    0% { transform: translateY(0) scale(1); }
    20% { transform: translateY(20px) scale(1.05); }
    100% { transform: translateY(-130vh) scale(0.5); opacity: 0; }
  }

  .rocket-fire {
    transform-origin: 60px 165px;
    animation: fireWiggle 0.15s ease-in-out infinite;
  }
  @keyframes fireWiggle {
    0%,100% { transform: scaleY(1) scaleX(1); }
    50% { transform: scaleY(1.15) scaleX(0.9); }
  }

  .intro-title {
    font-family: var(--font-title);
    font-size: clamp(28px, 5vw, 56px);
    text-align: center;
    line-height: 1.3;
    color: var(--text);
    text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 2;
  }
  body[data-theme="pastel"] .intro-title { text-shadow: 0 4px 16px rgba(255,255,255,0.6); }

  .intro-sub {
    font-family: var(--font-body);
    font-size: clamp(18px, 2.2vw, 26px);
    color: var(--text-soft);
    z-index: 2;
  }

  /* ─── HOME SCREEN ─── */
  .home-screen { padding: 6vh 4vw 2vh; justify-content: flex-start; gap: 8px; }

  .home-title {
    font-family: var(--font-title);
    font-size: clamp(26px, 3.8vw, 44px);
    z-index: 2;
    color: var(--text);
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    pointer-events: none;
  }
  .home-sub {
    font-family: var(--font-body);
    font-size: clamp(16px, 2vw, 22px);
    color: var(--text-soft);
    margin-bottom: 12px;
    z-index: 2;
    pointer-events: none;
  }

  .home-back-button {
    position: absolute;
    top: 18px;
    left: 18px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    color: var(--text);
    font-family: var(--font-title);
    font-size: 16px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .home-back-button:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
  body[data-theme="pastel"] .home-back-button {
    background: rgba(255,255,255,0.7);
    border-color: rgba(42,45,91,0.2);
  }

  .progress-bar {
    position: absolute;
    top: 18px;
    right: 18px;
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 8px 14px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    z-index: 10;
    pointer-events: none;
  }
  body[data-theme="pastel"] .progress-bar {
    background: rgba(255,255,255,0.7);
    border-color: rgba(42,45,91,0.2);
  }
  .progress-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s;
  }
  body[data-theme="pastel"] .progress-dot { background: rgba(42,45,91,0.2); }
  .progress-dot.visited {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    transform: scale(1.2);
  }
  .progress-text {
    font-family: var(--font-title);
    font-size: 16px;
    margin-left: 6px;
    color: var(--text);
  }

  .orbit-stage {
    position: relative;
    width: min(92vw, 78vh);
    height: min(92vw, 78vh);
    max-width: 720px;
    max-height: 720px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1vh;
  }

  .orbit-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1.5px dashed rgba(255,217,61,0.18);
    border-radius: 50%;
    pointer-events: none;
  }
  body[data-theme="pastel"] .orbit-ring { border-color: rgba(255,156,200,0.4); }

  .orbiter {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    animation: orbitSpin linear infinite;
    pointer-events: none;
  }
  @keyframes orbitSpin {
    from { transform: translate(-50%, -50%) rotate(0); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .planet-handle {
    position: absolute;
    top: 50%; left: 100%;
    transform: translate(-50%, -50%);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    transition: filter 0.3s, transform 0.15s;
    animation: orbitSpin linear infinite reverse;
    animation-duration: inherit;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .sun-handle {
    position: absolute;
    top: 50%; left: 50%;
    animation: none;
    transition: transform 0.3s, filter 0.3s;
  }
  .planet-handle:hover, .planet-handle.hovered {
    filter: brightness(1.15) drop-shadow(0 0 20px var(--accent));
    z-index: 5;
  }
  .planet-handle:active {
    transform: translate(-50%, -50%) scale(0.92);
  }
  .sun-handle:active {
    transform: translate(-50%, -50%) scale(0.92);
  }

  .planet-visual {
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    flex: 0 0 auto;
  }

  .planet-name-tag {
    font-family: var(--font-title);
    font-size: clamp(13px, 1.4vw, 17px);
    color: var(--text);
    background: rgba(0,0,0,0.55);
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    margin-top: 6px;
    flex: 0 0 auto;
  }
  body[data-theme="pastel"] .planet-name-tag {
    background: rgba(255,255,255,0.85);
    color: #2A2D5B;
    text-shadow: none;
  }
  .sun-name-tag {
    background: var(--pink);
    color: #fff;
    font-size: clamp(14px, 1.6vw, 19px);
  }

  .planet-handle.visited::after {
    content: '⭐';
    position: absolute;
    top: 4px;
    right: 4px;
    font-size: clamp(14px, 1.5vw, 20px);
    background: var(--accent);
    border-radius: 50%;
    width: 24px; height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .planet-label {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    font-family: var(--font-title);
    font-size: clamp(15px, 1.5vw, 20px);
    background: var(--accent);
    color: #2A2D5B;
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
    box-shadow: 0 4px 0 #2A2D5B;
    pointer-events: none;
    animation: labelPop 0.3s ease-out;
  }
  .sun-label { background: var(--pink); color: #fff; }
  @keyframes labelPop {
    from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.5); }
    to { opacity: 1; transform: translateX(-50%) translateY(-8px) scale(1); }
  }

  .visited-badge {
    position: absolute;
    top: -8%;
    right: -8%;
    font-size: clamp(14px, 1.5vw, 22px);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  /* Planet self-spin (about own center) */
  .planet-spin {
    transform-origin: 100px 100px;
    animation: planetSpin linear infinite;
    animation-duration: var(--spin-duration, 20s);
  }
  @keyframes planetSpin {
    from { transform: rotate(0); }
    to { transform: rotate(360deg); }
  }

  .sun-pulse {
    transform-origin: 100px 100px;
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  /* ─── DETAIL SCREEN ─── */
  .detail-screen {
    justify-content: flex-start;
    padding: 14px 3vw 18px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at center top, color-mix(in oklab, var(--planet-color) 30%, transparent), transparent 60%),
      radial-gradient(ellipse at top, var(--bg-2), var(--bg-1) 70%);
  }

  .detail-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    z-index: 5;
    flex: 0 0 auto;
  }

  .detail-body {
    flex: 1 1 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 0;
    z-index: 2;
  }
  .detail-left, .detail-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .detail-right { gap: 4px; width: 100%; }

  .planet-stage {
    position: relative;
    width: clamp(220px, 32vh, 360px);
    height: clamp(220px, 32vh, 360px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    flex: 0 0 auto;
  }

  .planet-big {
    position: relative;
    filter: drop-shadow(0 0 40px var(--planet-glow));
    transition: transform 0.3s ease;
  }
  .planet-big.bounce { animation: planetBounce 0.3s ease; }
  @keyframes planetBounce {
    0%,100% { transform: scale(1); }
    30% { transform: scale(0.94); }
    60% { transform: scale(1.06); }
  }

  .moon {
    position: absolute;
    top: 50%; left: 50%;
    width: 24px; height: 24px;
    border-radius: 50%;
    box-shadow: 0 0 12px currentColor, inset -4px -4px 8px rgba(0,0,0,0.3);
    z-index: 3;
  }
  .moon-label {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    font-family: var(--font-title);
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    text-shadow: 0 0 6px #000;
  }

  .hint-text {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-body);
    font-size: clamp(13px, 1.3vw, 17px);
    color: var(--text-soft);
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }
  body[data-theme="pastel"] .hint-text { background: rgba(255,255,255,0.8); color: #2A2D5B; }

  .planet-name {
    font-family: var(--font-title);
    font-size: clamp(28px, 4.2vw, 48px);
    color: var(--text);
    text-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 2;
    text-align: center;
    line-height: 1.1;
  }
  .planet-intro {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(17px, 2vw, 24px);
    color: var(--text-soft);
    text-align: center;
    margin: 4px 0 8px;
    z-index: 2;
    max-width: 700px;
    line-height: 1.3;
  }

  .intro-word {
    display: inline-block;
    transition: color 0.2s, transform 0.2s;
  }
  .intro-word.karaoke-past {
    color: var(--accent);
    opacity: 0.85;
  }
  .intro-word.karaoke-active {
    color: var(--accent);
    text-shadow: 0 0 16px var(--accent), 0 2px 4px rgba(0,0,0,0.4);
    animation: karaokeBounce 0.45s cubic-bezier(.34,1.56,.64,1);
    transform-origin: center bottom;
  }
  @keyframes karaokeBounce {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-10px) scale(1.25); }
    100% { transform: translateY(0) scale(1.08); }
  }
  body[data-theme="pastel"] .intro-word.karaoke-active,
  body[data-theme="pastel"] .intro-word.karaoke-past {
    color: var(--pink);
    text-shadow: 0 0 12px var(--pink);
  }

  .fact-cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(140px, 200px));
    gap: 12px;
    margin: 4px 0 10px;
    z-index: 2;
    width: 100%;
    max-width: 700px;
    justify-content: center;
  }
  @media (max-width: 640px) {
    .fact-cards { grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 100%; }
  }

  .fact-card {
    position: relative;
    aspect-ratio: 3 / 4;
    max-height: 30vh;
    border: none;
    background: transparent;
    cursor: pointer;
    perspective: 800px;
    padding: 0;
    font-family: var(--font-body);
  }
  .fact-card-inner {
    position: relative;
    width: 100%; height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  .fact-card.flipped .fact-card-inner { transform: rotateY(180deg); }

  .fact-card-front, .fact-card-back {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    text-align: center;
    border: 3px solid #2A2D5B;
    box-shadow: 0 6px 0 #2A2D5B, 0 12px 24px rgba(0,0,0,0.3);
  }
  body[data-theme="pastel"] .fact-card-front,
  body[data-theme="pastel"] .fact-card-back {
    border-color: #4B3F8B;
    box-shadow: 0 6px 0 #4B3F8B, 0 12px 24px rgba(75,63,139,0.15);
  }

  .fact-card-front {
    background: linear-gradient(155deg, #fff, var(--text-soft));
    color: #2A2D5B;
  }
  .fact-card-back {
    background: linear-gradient(155deg, var(--planet-color), var(--planet-glow));
    color: #fff;
    transform: rotateY(180deg);
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .fact-icon {
    font-size: clamp(36px, 4.5vw, 56px);
    line-height: 1;
    margin-bottom: 4px;
  }
  .fact-label {
    font-family: var(--font-title);
    font-size: clamp(18px, 2vw, 24px);
  }
  .fact-hint {
    font-family: var(--font-body);
    font-size: clamp(12px, 1.3vw, 16px);
    margin-top: 4px;
    color: #FF6B9D;
  }
  .fact-text {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(14px, 1.6vw, 20px);
    line-height: 1.35;
    text-wrap: pretty;
  }

  .next-button {
    font-size: clamp(18px, 2.2vw, 26px);
    padding: 12px 32px;
    margin-top: 4px;
  }

  /* ─── COMPLETION ─── */
  .completion-screen { gap: 18px; padding-top: 6vh; }
  .completion-title {
    font-family: var(--font-title);
    font-size: clamp(32px, 5.5vw, 64px);
    text-align: center;
    line-height: 1.25;
    text-shadow: 0 4px 20px var(--accent);
    z-index: 2;
    color: var(--text);
  }
  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px 24px;
    z-index: 2;
    max-width: 720px;
  }
  @media (max-width: 640px) {
    .sticker-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  }
  .sticker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    animation: stickerPop 0.6s cubic-bezier(.34,1.56,.64,1) backwards;
  }
  .sticker:nth-child(1) { animation-delay: 0.05s; }
  .sticker:nth-child(2) { animation-delay: 0.1s; }
  .sticker:nth-child(3) { animation-delay: 0.15s; }
  .sticker:nth-child(4) { animation-delay: 0.2s; }
